<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>जिला बाजार — Jila Bazar</title>
    <style>
      html, body { margin: 0; padding: 0; }
      #splash {
        position: fixed; inset: 0; background: #0B2A59; display: flex; flex-direction: column;
        align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; z-index: 9999;
      }
      #splash .jb-splash-title { font-size: 42px; font-weight: 800; margin-top: 22px; letter-spacing: 0.5px; }
      #splash .jb-splash-title .jila { color: #18B83A; }
      #splash .jb-splash-title .bazar { color: #F5A000; }
      #splash .jb-splash-tag { color: #FFFFFF; opacity: 0.85; font-size: 15px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <svg width="96" height="96" viewBox="0 0 380 380" aria-hidden="true">
          <rect x="0" y="0" width="380" height="380" rx="76" fill="#0B2A59" />
          <path d="M 152 100 A 34 34 0 0 1 220 100" fill="none" stroke="#F5A000" stroke-width="14" stroke-linecap="round" />
          <path d="M 128 118 L 244 118 L 224 158 L 148 158 Z" fill="#F5A000" />
          <path d="M 224 158 L 224 250 C 224 268 214 280 196 280 L 190 280 L 190 316 L 196 316 C 246 316 268 284 268 250 L 268 158 Z" fill="#18B83A" />
          <circle cx="118" cy="292" r="72" fill="#FFFFFF" />
          <circle cx="140" cy="292" r="62" fill="#0B2A59" />
          <path d="M 96 268 L 118 268 L 130 306 L 176 306 L 186 278 L 122 278" fill="none" stroke="#0B2A59" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="132" cy="320" r="8" fill="#0B2A59" />
          <circle cx="168" cy="320" r="8" fill="#0B2A59" />
        </svg>
        <div class="jb-splash-title"><span class="jila">Jila</span><span class="bazar">Bazar</span></div>
        <div class="jb-splash-tag">Apne Zila Ka Apna Bazar</div>
      </div>
    </div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
